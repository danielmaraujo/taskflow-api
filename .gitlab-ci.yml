stages:
  - pre-deploy-tests
  - deploy
  - load-test

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository/

unit-tests:
  stage: pre-deploy-tests
  image: maven:3.9.9-eclipse-temurin-17
  script:
    - mvn test -Dtest="!*IntegrationTest"
  rules:
    - if: $CI_COMMIT_REF_NAME == "deploy_gitlab"

integration-tests:
  stage: pre-deploy-tests
  image: maven:3.9.9-eclipse-temurin-17
  needs: ["unit-tests"]
  script:
    - mvn test -Dtest="*IntegrationTest"
  rules:
    - if: $CI_COMMIT_REF_NAME == "deploy_gitlab"

security-test:
  stage: pre-deploy-tests
  image: maven:3.9.9-eclipse-temurin-17
  needs: ["integration-tests"]
  before_script:
    - curl -o snyk https://static.snyk.io/cli/latest/snyk-linux
    - chmod +x snyk
    - mv snyk /usr/local/bin/
  script:
    - chmod +x ./mvnw
    - snyk auth $SNYK_TOKEN
    - snyk test --severity-threshold=high
  rules:
    - if: $CI_COMMIT_REF_NAME == "deploy_gitlab"

deploy-to-cloud-run:
  stage: deploy
  image: google/cloud-sdk:alpine
  needs: ["security-test"]
  rules:
    - if: $CI_COMMIT_REF_NAME == "deploy_gitlab"
  before_script:
    - echo $GCP_SA_KEY | base64 -d > gcp-key.json
    - gcloud auth activate-service-account --key-file gcp-key.json
    - gcloud config set project $GCP_PROJECT_ID
  script:
    - mkdir -p keys
    - echo "$RSA_PRIVATE_KEY" | base64 -d > keys/private_key.pem
    - echo "$RSA_PUBLIC_KEY" | base64 -d > keys/public_key.pem
    - gcloud run deploy taskflow-api
      --source .
      --region us-central1
      --allow-unauthenticated
      --memory=512Mi
      --cpu=1
      --set-env-vars SPRING_PROFILES_ACTIVE=prod

load-test:
  stage: load-test
  image:
    name: grafana/k6:latest
    entrypoint: [""]
  needs: ["deploy-to-cloud-run"]
  script:
    - k6 run ./k6/load-test.js
  rules:
    - if: $CI_COMMIT_REF_NAME == "deploy_gitlab"